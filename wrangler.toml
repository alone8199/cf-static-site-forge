# Cloudflare Workers 部署配置。
# 非机密业务配置（域名、限额、SMTP、安全策略）请修改 config/app.config.ts。
# 机密请使用 `wrangler secret put <NAME>`（本地使用 .dev.vars），不要写在本文件中。

name = "cf-static-site-forge"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 路由：主应用域名 + 用户站点通配符子域（域名需与 config/app.config.ts 保持一致）
routes = [
  { pattern = "app.example.com/*", zone_name = "example.com" },
  { pattern = "*.sites.example.com/*", zone_name = "example.com" }
]

# 超级用户（规格要求：由环境变量控制，不通过注册流程授予）
# 仅“邮箱已验证 + 在列表中”才生效。逗号分隔。
[vars]
ADMIN_EMAILS = "admin@example.com"
ADMIN_USER_IDS = ""

# 前端静态资源（public/）
[assets]
directory = "./public"
binding = "ASSETS"
# 必须：Worker 先执行，由它做 Host 分流；否则站点子域会直接服务 public/ 内容
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cf_static_site_forge"
database_id = "<your-d1-database-id>"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "<your-kv-namespace-id>"

# 用户站点文件存储（独立 KV namespace，避免与限速、验证码数据混用）
[[kv_namespaces]]
binding = "FILES_KV"
id = "<your-files-kv-namespace-id>"

# 需要设置的 Secrets（wrangler secret put）：
#   CAPTCHA_SECRET      图片验证码 HMAC 密钥（必需）
#   IP_HASH_SECRET      IP 哈希密钥（必需）
#   SESSION_SECRET      会话相关派生密钥（必需）
#   SMTP_USERNAME       SMTP 账号（mail.mode=smtp 时必需）
#   SMTP_PASSWORD       SMTP 密码 / 授权码（mail.mode=smtp 时必需）
#   BOOTSTRAP_TOKEN     一次性管理员初始化令牌（可选，见 README）
#   TURNSTILE_SECRET    Turnstile 密钥（captcha.provider=turnstile 时必需）
